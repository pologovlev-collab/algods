<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Сигнал задачи предлагает гипотезу</title><desc id="desc">Пара и порядок: два указателя. Непрерывный фрагмент: окно с инвариантом. Монотонная граница: бинарный поиск. Повторяющаяся подзадача: состояние DP.</desc>
<rect width="1200" height="630" fill="#f7f8fb"/><g font-family="Arial,sans-serif" fill="#172235">
<text x="70" y="85" font-size="38" font-weight="700">Сначала свойство, потом техника</text>
<g font-size="28"><text x="70" y="195">Пара + порядок</text><text x="680" y="195">Проверить два указателя</text>
<text x="70" y="290">Непрерывный фрагмент</text><text x="680" y="290">Проверить окно и состояние</text>
<text x="70" y="385">Одна монотонная граница</text><text x="680" y="385">Проверить бинарный поиск</text>
<text x="70" y="480">Повторяющаяся подзадача</text><text x="680" y="480">Определить состояние DP</text></g>
<path d="M580 182H630M580 277H630M580 372H630M580 467H630" stroke="#2458a6" stroke-width="3"/>
<path d="M70 525H1130" stroke="#ccd4df"/><text x="70" y="580" font-size="25">Это гипотезы: докажите инвариант и найдите контрпример.</text></g></svg>
