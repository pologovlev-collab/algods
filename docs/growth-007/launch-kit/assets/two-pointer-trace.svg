<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Два указателя: доказанный сдвиг</title><desc id="desc">Отсортированный массив 1 2 4 7, target 6. Суммы крайних пар 8, 5, 6. При слишком большой сумме исключаем right, при слишком маленькой left.</desc>
<rect width="1200" height="630" fill="#f7f8fb"/><g font-family="Arial,sans-serif" fill="#172235">
<text x="70" y="85" font-size="38" font-weight="700">Пара в отсортированном массиве</text><text x="70" y="140" font-size="26">a = [1, 2, 4, 7] · target = 6 · два разных индекса</text>
<g font-size="34"><text x="120" y="235">1 + 7 = 8</text><text x="120" y="340">1 + 4 = 5</text><text x="120" y="445">2 + 4 = 6</text></g>
<path d="M360 222H460M360 327H460M360 432H460" stroke="#2458a6" stroke-width="3"/>
<g font-size="27"><text x="490" y="235">Слишком много → исключаем правый элемент</text><text x="490" y="340">Слишком мало → исключаем левый элемент</text><text x="490" y="445">Равенство → пара найдена</text></g>
<path d="M70 495H1130" stroke="#ccd4df"/><text x="70" y="550" font-size="25">Если ответ существует, его индексы остаются между границами.</text><text x="70" y="590" font-size="25">Без порядка элементов этот аргумент не работает.</text></g></svg>
